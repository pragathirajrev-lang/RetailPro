<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Dashboard</title>
  <meta name="description" content="Dashboard showing confidential business data for the Business Head." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .dashboard-container {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 30px;
      color: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px 8px;
      text-align: left;
    }
    th {
      background: rgba(255,255,255,0.2);
    }
    tr:nth-child(even) {
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <h2>Business Head Dashboard</h2>
    <p>Confidential sales and inventory data.</p>
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Units Sold</th>
          <th>Remaining Stock</th>
          <th>Revenue ($)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Widget A</td>
          <td>1,240</td>
          <td>320</td>
          <td>62,000</td>
        </tr>
        <tr>
          <td>Gadget B</td>
          <td>845</td>
          <td>150</td>
          <td>42,250</td>
        </tr>
        <tr>
          <td>Tool C</td>
          <td>1,560</td>
          <td>410</td>
          <td>78,000</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
